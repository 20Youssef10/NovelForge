<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="NovelForge">
  <title>NovelForge</title>
  <defs>
    <linearGradient id="forge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2A38"/>
      <stop offset="1" stop-color="#0B141C"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0A868"/>
      <stop offset="1" stop-color="#D2622F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F5C88A" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#F5C88A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#forge)"/>

  <!-- Glow sits behind the bell and is clipped to it, so it reads as heat
       rather than as a rectangle under the mark. -->
  <g transform="translate(256 232)">
    <ellipse cx="0" cy="46" rx="150" ry="132" fill="url(#glow)"/>
    <!-- bell body -->
    <path d="M0 -104
             c -50 0 -80 42 -84 100
             c -2 30 -8 50 -21 67
             c -6 8 0 17 10 17
             l 190 0
             c 10 0 16 -9 10 -17
             c -13 -17 -19 -37 -21 -67
             c -4 -58 -34 -100 -84 -100 z"
          fill="url(#ember)"/>
    <rect x="-100" y="72" width="200" height="15" rx="7.5" fill="#F5C88A"/>
    <circle cx="0" cy="-108" r="15" fill="#F5C88A"/>
    <path d="M0 38 l 17 44 h -34 z" fill="#FFF3E0"/>
  </g>

  <!-- Anvil: the forge. Bell lip meets the anvil face. -->
  <g transform="translate(256 330)">
    <path d="M-124 0 h 248 l -30 30 h -40 l 16 30 h -140 l 16 -30 h -40 z" fill="#8FA3B4"/>
    <rect x="-104" y="58" width="208" height="13" rx="6.5" fill="#5B6B7A"/>
  </g>
</svg>