name: Catalog

# Regenerates the OpenCode HTTP skill catalog whenever skills change, and
# commits the result so the catalog can be served straight from raw
#.githubusercontent.com for OpenCode installs.

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "scripts/build_catalog.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Regenerate catalog
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build catalog
        run: python3 scripts/build_catalog.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- catalog; then
            echo "catalog already up to date"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog
          git commit -m "chore: regenerate OpenCode catalog"
          git push
